interface:
  display_name: "高频 UI 风险探索"
  short_description: "基于高频问题模式执行有证据的 Web UI 探索"
  default_prompt: >-
    请结合 reverse-test-workbench 执行高频 UI 风险探索。
    完成入口和 B01 快速地图后，先询问本轮是否允许创建并保存 AI 自建测试数据；
    未明确授权时只浏览和临时填写，不保存。
    根据页面实际能力选择交互跳转、表单校验、展示结构、流程状态和数据一致性探针，
    仅对适用自由文本字段执行可验证的 799 字符探针。
    提交、审批、驳回、撤回等流程动作必须另行确认，单角色无法验证的内容保持未覆盖。
