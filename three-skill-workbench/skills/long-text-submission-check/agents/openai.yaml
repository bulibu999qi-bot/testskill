interface:
  display_name: "799 字符长文本专项"
  short_description: "逐字段检查精确 799 字符的输入、提交与持久化"
  default_prompt: >-
    请执行 799 字符长文本专项检查。盘点当前表单内所有可见、启用且可编辑的普通文本字段，
    记录排除项与原因，并为每个合格字段生成带唯一标记、程序校验为精确 799 字符的测试值。
    每次只检查一个字段，先测控件实际保留内容；任何提交、保存或自动写入前，
    必须按冻结后的字段清单询问“允许提交全部字段”“仅允许提交：字段名列表”或“不允许提交”。
    获授权后每个字段最多提交一条独立记录，并重新打开记录核对持久化内容。
