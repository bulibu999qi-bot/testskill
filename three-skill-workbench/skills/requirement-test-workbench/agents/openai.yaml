interface:
  display_name: "需求测试分析工作台"
  short_description: "从 PRD 或用户故事生成完整测试设计与正式用例"
  default_prompt: >-
    请根据这份需求完成详细测试分析并生成覆盖充分的正式测试用例。
    先拆分功能点、业务规则、角色、状态、数据范围和异常分支，再逐项生成用例。
    主流程、替代流程、异常流程、边界值、权限、状态迁移、数据一致性、幂等、并发和前后端校验应分别覆盖。
    除前置条件、操作路径、输入类别、预期结果和失败定位方式均实质相同外，不要合并用例。
    每个纳入本轮的测试点至少映射一条用例，P0/P1 测试点优先生成独立用例。
    输出前检查测试点到用例的映射和遗漏；如果最终用例较少，必须说明需求规模、合并依据和未覆盖项。
    根据需求复杂度设置正式用例数量基线：简单需求不少于 15 条，中等需求不少于 30 条，复杂需求不少于 50 条。
    每个核心模块原则上不少于 10 条，涉及资损、越权、数据污染或核心状态流的高风险模块原则上不少于 15 条。
    数量基线不是上限；未达到基线时必须重新扫描正常、替代、异常、边界、权限、状态、幂等、并发和数据一致性维度。
    每条用例必须提供可复现的前置条件、具体测试数据、原子化操作步骤和逐项对应的预期结果。
    前置条件需按适用范围明确环境、账号角色、权限、配置、初始数据和对象状态。
    测试步骤每步只描述一个主要动作，明确页面入口、操作对象、输入值和提交方式，不得使用“正常操作”“填写相关信息”等模糊表达。
    预期结果应与步骤编号对应，并包含可观察的页面反馈、状态变化、数据影响或下游结果，不得只写“成功”“失败”或“功能正常”。
    需求信息不足时不得为达到数量编造规则，应输出候选用例或待确认项并说明缺口。
